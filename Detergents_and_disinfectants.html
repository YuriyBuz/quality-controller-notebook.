<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Облік: Миючі та дез. засоби</title>
    
    <link rel="manifest" id="manifest-link">
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Облік Миючих">
    <link rel="apple-touch-icon" href="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg-color: #ffffff;
            --text-color: #1e293b;
            --text-muted-color: #64748b;
            --item-bg-color: #f1f5f9;
            --item-hover-bg-color: #e2e8f0;
            --border-color: #e2e8f0;
            --active-btn-bg: #0891b2; 
            --active-btn-text: #ffffff;
            --error-btn-bg: #ef4444;
            --warning-bg: #fef3c7;
            --warning-border: #f59e0b;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .card { background-color: var(--card-bg-color); }
        .text-muted { color: var(--text-muted-color); }

        .inventory-item, .category-card {
            background-color: var(--item-bg-color);
            border: 1px solid var(--border-color);
            transition: transform 0.1s ease, box-shadow 0.2s ease, background-color 0.2s;
        }
        
        .inventory-item:active, .category-card:active {
            transform: scale(0.98);
        }

        .category-card:hover {
            background-color: var(--item-hover-bg-color);
        }

        .low-stock {
            border-left: 4px solid var(--error-btn-bg);
            background-color: var(--warning-bg);
        }

        .modal-overlay { background-color: rgba(0, 0, 0, 0.6); z-index: 1000; backdrop-filter: blur(2px); }
        .modal-content { z-index: 1001; max-height: 95vh; overflow-y: auto; }
        
        input[type="number"], input[type="text"], input[type="date"], select {
            background-color: var(--card-bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .network-status {
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255,255,255,0.8);
            padding: 4px 10px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
            margin-top: 0.5rem;
            margin-left: auto;
            width: fit-content;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .status-dot.online { background: #0891b2; }
        .status-dot.offline { background: #ef4444; }
        .status-dot.syncing { background: #f59e0b; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .loader {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--active-btn-bg);
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans">

            "start_url": ".",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#0891b2"
        };
        document.getElementById('manifest-link').href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
    </script>

    <div id="customDialogOverlay" class="fixed inset-0 hidden items-center justify-center modal-overlay z-[2000] p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center transform transition-all border border-gray-100">
            <h3 id="customDialogMessage" class="text-lg font-bold mb-6 text-gray-800 whitespace-pre-wrap"></h3>
            <div class="flex justify-center gap-3" id="customDialogButtons"></div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_5c_lnak8zE1rCP4DI7rSfnjgIbzuBy4zrJOguyG9NLseopQ3BGU4XFL5QnEcK61L/exec'; 

        let allData = []; 
        let historyData = [];
        let appState = {
            view: 'categories', 
            activeCategory: null,
            filterHistoryToday: false
        };
        let currentSelectedItem = null;
        let currentOperation = 'usage'; 
        
        const OFFLINE_KEY = 'sanitationOfflineQueueV2';
        const CACHE_KEY = 'sanitationInventoryCacheV2';

        const showCustomDialog = (message, isConfirm = false) => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay');
                const msgEl = document.getElementById('customDialogMessage');
                const btnsEl = document.getElementById('customDialogButtons');

                msgEl.innerHTML = message; 
                btnsEl.innerHTML = '';

                const closeDialog = () => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                };

                if (isConfirm) {
                    const btnCancel = document.createElement('button');
                    btnCancel.className = 'px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold hover:bg-gray-300 transition-colors';
                    btnCancel.textContent = 'Скасувати';
                    btnCancel.onclick = () => { closeDialog(); resolve(false); };

                    const btnOk = document.createElement('button');
                    btnOk.className = 'px-4 py-2 bg-cyan-600 text-white rounded-lg font-semibold hover:bg-cyan-700 transition-colors shadow-md';
                    btnOk.textContent = 'Підтвердити';
                    btnOk.onclick = () => { closeDialog(); resolve(true); };

                    btnsEl.appendChild(btnCancel);
                    btnsEl.appendChild(btnOk);
                } else {
                    const btnOk = document.createElement('button');
                    btnOk.className = 'px-6 py-2 bg-cyan-600 text-white rounded-lg font-semibold hover:bg-cyan-700 transition-colors shadow-md';
                    btnOk.textContent = 'Зрозуміло';
                    btnOk.onclick = () => { closeDialog(); resolve(true); };
                    btnsEl.appendChild(btnOk);
                }

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
            });
        };

        const showPasswordDialog = () => {
            return new Promise((resolve) => {
                const overlay = document.getElementById('customDialogOverlay');
                const msgEl = document.getElementById('customDialogMessage');
                const btnsEl = document.getElementById('customDialogButtons');

                msgEl.innerHTML = 'Введіть пароль:<br><input type="password" id="reportPassword" class="mt-4 w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cyan-500 text-center text-lg" placeholder="****">';
                btnsEl.innerHTML = '';

                const closeDialog = () => {
                    overlay.classList.add('hidden');
                    overlay.classList.remove('flex');
                };

                const btnCancel = document.createElement('button');
                btnCancel.className = 'px-4 py-2 bg-gray-200 text-gray-800 rounded-lg font-semibold hover:bg-gray-300 transition-colors';
                btnCancel.textContent = 'Скасувати';
                btnCancel.onclick = () => { closeDialog(); resolve(null); };

                const btnOk = document.createElement('button');
                btnOk.className = 'px-4 py-2 bg-cyan-600 text-white rounded-lg font-semibold hover:bg-cyan-700 transition-colors shadow-md';
                btnOk.textContent = 'Підтвердити';
                btnOk.onclick = () => {
                    const pwd = document.getElementById('reportPassword').value;
                    closeDialog();
                    resolve(pwd);
                };

                btnsEl.appendChild(btnCancel);
                btnsEl.appendChild(btnOk);

                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                
                setTimeout(() => document.getElementById('reportPassword').focus(), 100);
            });
        };

        const customAlert = (msg) => showCustomDialog(msg, false);

        const updateNetworkStatus = () => {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
            
            if (!navigator.onLine) {
                dot.className = 'status-dot offline';
                text.textContent = `Офлайн (${queue.length})`;
            } else if (queue.length > 0) {
                dot.className = 'status-dot offline';
                text.textContent = `Черга (${queue.length})`;
            } else {
                dot.className = 'status-dot online';
                text.textContent = 'Онлайн';
            }
        };

        const saveToOfflineQueue = (data) => {
            const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
            queue.push(data);
            localStorage.setItem(OFFLINE_KEY, JSON.stringify(queue));
            updateNetworkStatus();
        };

        const processOfflineQueue = async () => {
            const queue = JSON.parse(localStorage.getItem(OFFLINE_KEY) || '[]');
            if (queue.length === 0 || !navigator.onLine) return;

            const statusDot = document.getElementById('statusDot');
            statusDot.className = 'status-dot syncing';
            document.getElementById('statusText').textContent = 'Синхронізація...';

            const newQueue = [];
            for (const item of queue) {
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(item)
                    });
                } catch (e) {
                    newQueue.push(item);
                }
            }

            localStorage.setItem(OFFLINE_KEY, JSON.stringify(newQueue));
            updateNetworkStatus();
            
            if (newQueue.length === 0) {
                fetchData(true);
            }
        };

        const populateUsers = (controllers, employees) => {
            const empSelect = document.getElementById('employeeSelect');
            const currentVal = empSelect.value || localStorage.getItem('selectedMechanic_Sanitation');
            
            empSelect.innerHTML = '<option value="">-- Оберіть зі списку --</option>';
            controllers.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                empSelect.appendChild(opt);
            });
            if (currentVal && controllers.includes(currentVal)) {
                empSelect.value = currentVal;

        // --- ВАЖЛИВО: Оновлений алгоритм FEFO за датою ---
        function getFifoSuggestion(item) {
            if (!item.ops || !item.qts || !item.bats) return { batch: "", expDate: "" };
            
            const splitRegex = /,\s*\n?/;
            const ops = item.ops.split(splitRegex).map(s => s.trim());
            const qts = item.qts.split(splitRegex).map(s => s.trim());
            const bats = item.bats.split(splitRegex).map(s => s.trim());
            
            let ledger = [];
            const maxLength = Math.max(ops.length, qts.length, bats.length);
            
            for (let i = 0; i < maxLength; i++) {
                const op = ops[i] || "";
                const qStr = qts[i] || "0";
                const b = bats[i] || "-";
                
                const qMatch = qStr.match(/[\d.-]+/);
                const q = qMatch ? parseFloat(qMatch[0]) : 0;
                
                let batchName = "";
                let expDate = "";
                if (b && b !== "-" && b !== "Залишок") {
                    let batchMatch = b.match(/Партія:\s*(.*?)\s*(?:\(до\s*(.*?)\))?$/);
                    if (batchMatch) {
                        batchName = batchMatch[1].trim();
                        expDate = batchMatch[2] ? batchMatch[2].trim() : "";
                    } else {
                        batchName = b.replace('Партія:', '').trim();
                    }
                }
                
                if (op === "Поповнення" || qStr.includes('+')) {
                    ledger.push({ batch: batchName, expDate: expDate, qty: q });
                } else if (op === "Видача" || qStr.includes('-')) {
                    let toSubtract = Math.abs(q);
                    
                    // Відбираємо ті, що є на залишку, і сортуємо по даті (FEFO)
                    let availableIndices = [];
                    for(let k=0; k<ledger.length; k++) {
                        if (ledger[k].qty > 0) {
                            let ed = ledger[k].expDate ? new Date(ledger[k].expDate).getTime() : 9999999999999;
                            availableIndices.push({ index: k, sortDate: ed });
                        }
                    }
                    availableIndices.sort((a,b) => a.sortDate - b.sortDate);

                    for (let j = 0; j < availableIndices.length; j++) {
                        let idx = availableIndices[j].index;
                        let sub = Math.min(ledger[idx].qty, toSubtract);
                        ledger[idx].qty -= sub;
                        toSubtract -= sub;
                        if (toSubtract <= 0.001) break;
                    }
                } else if (op === "Інвентаризація" || qStr.includes('=')) {
                    let currentSum = ledger.reduce((sum, entry) => sum + entry.qty, 0);
                    let diff = q - currentSum;
                    
                    if (diff < -0.001) {
                        let toSubtract = Math.abs(diff);
                        let availableIndices = [];
                        for(let k=0; k<ledger.length; k++) {
                            if (ledger[k].qty > 0) {
                                let ed = ledger[k].expDate ? new Date(ledger[k].expDate).getTime() : 9999999999999;
                                availableIndices.push({ index: k, sortDate: ed });
                            }
                        }
                        availableIndices.sort((a,b) => a.sortDate - b.sortDate);

                        for (let j = 0; j < availableIndices.length; j++) {
                            let idx = availableIndices[j].index;
                            let sub = Math.min(ledger[idx].qty, toSubtract);
                            ledger[idx].qty -= sub;
                            toSubtract -= sub;
                            if (toSubtract <= 0.001) break;
                        }
                    } else if (diff > 0.001) {
                        ledger.push({ batch: batchName, expDate: expDate, qty: diff });
                    }
                }
            }
            
            // Збираємо фактичні залишки після всієї історії та знаходимо найстарішу дату
            let finalAvailable = [];
            for(let k=0; k<ledger.length; k++) {
                if (ledger[k].qty > 0.001 && ledger[k].batch) {
                    let ed = ledger[k].expDate ? new Date(ledger[k].expDate).getTime() : 9999999999999;
                    finalAvailable.push({ ...ledger[k], sortDate: ed });
                }
            }

            finalAvailable.sort((a,b) => a.sortDate - b.sortDate);

            if (finalAvailable.length > 0) {
                return { batch: finalAvailable[0].batch, expDate: finalAvailable[0].expDate };
            }
            return { batch: "", expDate: "" };
        }

            document.getElementById('useUsedBy').value = ""; 
            document.getElementById('useLocation').value = ""; 
            document.getElementById('useDate').value = new Date().toISOString().split('T')[0];
            
            setTab('usage'); 

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            setTimeout(() => { modalContent.classList.remove('translate-y-full'); }, 10);
        };

        const closeUsageModal = () => {
            modalContent.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                currentSelectedItem = null;
            }, 300);
        };

        document.getElementById('closeUsageModalBtn').addEventListener('click', closeUsageModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeUsageModal(); });

        document.getElementById('submitUsageBtn').addEventListener('click', async () => {
            if (!currentSelectedItem) return;

            const controller = document.getElementById('employeeSelect').value;
            const quantity = parseFloat(document.getElementById('useQuantity').value);
            const usedBy = document.getElementById('useUsedBy').value.trim();
            const location = document.getElementById('useLocation').value.trim();
            const batch = document.getElementById('useBatch').value.trim();
            const expDate = document.getElementById('useExpDate').value;
            const date = document.getElementById('useDate').value; 

            if (isNaN(quantity) || quantity < 0) { customAlert("Введіть коректну кількість!"); return; }
            
            if (currentOperation === 'usage') {
                if (!usedBy) { customAlert("Вкажіть, ким було використано засіб (ПІБ)!"); return; }
                if (!location) { customAlert("Вкажіть, де був використаний засіб!"); return; }
            }

            const currentStock = parseFloat(currentSelectedItem.currentStock);
            if (currentOperation === 'usage' && quantity > currentStock) {
                const confirmOver = await showCustomDialog(`Увага!\nВи списуєте ${quantity} кг., але в залишку лише ${currentStock} кг. Продовжити?`, true);
                if (!confirmOver) return;
            }

            if (currentOperation === 'inventory') {
                const confirmInv = await showCustomDialog(`Ви впевнені, що хочете змінити залишок з ${currentStock} кг. на ${quantity} кг.?`, true);
                if (!confirmInv) return;
            }

            let actionName = "registerUsage";
            if (currentOperation === 'restock') actionName = "registerRestock";
            if (currentOperation === 'inventory') actionName = "registerInventory";

            const payload = {
                action: actionName,
                sheetName: currentSelectedItem.sheetName,
                row: currentSelectedItem.row,
                model: currentSelectedItem.model,
                controller: controller, 
                usedBy: currentOperation === 'usage' ? usedBy : "-", 
                quantity: quantity,
                location: currentOperation === 'usage' ? location : "-",
                batch: batch,
                expDate: expDate,
                date: date, 
                timestamp: new Date().toISOString()
            };

            const btn = document.getElementById('submitUsageBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<div class="loader w-5 h-5 mr-2 border-white border-top-transparent"></div> Зачекайте...';
            btn.disabled = true;

            try {
                if (!navigator.onLine) {
                    throw new Error("Offline");
                }

                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                showSuccessAndClose();
            } catch (e) {
                saveToOfflineQueue(payload);
                showSuccessAndClose(true);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        const showSuccessAndClose = (isOffline = false) => {
            if (currentSelectedItem) {
                const qty = parseFloat(document.getElementById('useQuantity').value);
                const categoryData = allData.find(c => c.name === currentSelectedItem.sheetName);
                if (categoryData) {
                    const itemInArray = categoryData.items.find(i => i.row === currentSelectedItem.row);
                    if (itemInArray) {
                        let currentStockNum = parseFloat(itemInArray.currentStock);
                        if (currentOperation === 'usage') {
                            itemInArray.currentStock = (currentStockNum - qty).toFixed(2);
                        } else if (currentOperation === 'restock') {
                            itemInArray.currentStock = (currentStockNum + qty).toFixed(2);
                        } else if (currentOperation === 'inventory') {
                            itemInArray.currentStock = qty.toFixed(2);
                        }
                    }
                }
                localStorage.setItem(CACHE_KEY, JSON.stringify(allData));
                renderState();
            }

            closeUsageModal();
            
            if (isOffline) {
                customAlert("Відсутній зв'язок.\nЗапис збережено в телефоні і буде відправлено автоматично при появі інтернету!");
            } else {
                const toast = document.createElement('div');
                toast.className = 'fixed top-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg z-[3000] font-bold text-sm flex items-center transition-opacity duration-300';
                
                let successMsg = "Успішно списано!";
                if (currentOperation === 'restock') successMsg = "Запаси поповнено!";
                if (currentOperation === 'inventory') successMsg = "Залишок оновлено!";

                toast.innerHTML = `<svg class="w-5 h-5 text-cyan-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> ${successMsg}`;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 300);
                }, 2000);
            }
        };

        // --- Ініціалізація ---
        document.addEventListener('DOMContentLoaded', () => {
            updateNetworkStatus();
            
            const savedMechanic = localStorage.getItem('selectedMechanic_Sanitation');
            if(savedMechanic) document.getElementById('employeeSelect').value = savedMechanic;
            document.getElementById('employeeSelect').addEventListener('change', (e) => {
                localStorage.setItem('selectedMechanic_Sanitation', e.target.value);
            });

            window.addEventListener('online', () => { updateNetworkStatus(); processOfflineQueue(); });
            window.addEventListener('offline', updateNetworkStatus);
            document.getElementById('networkStatusBtn').addEventListener('click', processOfflineQueue);

            fetchData();
        });
    </script>
</body>
</html>
