<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рекламації | QC Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: { colors: { slate: { 50: '#f8fafc', 800: '#1e293b', 900: '#0f172a' } } }
            }
        }
    </script>
    <style>
        :root { --bg-color: #f8fafc; --card-bg: #fff; --text: #1e293b; }
        .dark { --bg-color: #0f172a; --card-bg: #1e293b; --text: #f1f5f9; }
        body { background-color: var(--bg-color); color: var(--text); padding-bottom: 2rem; transition: background-color 0.3s ease; }
        .card { background-color: var(--card-bg); transition: background-color 0.3s ease; }
        input, select, textarea { background-color: transparent; width: 100%; color: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2); }
        .spinner { border: 3px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: #ef4444; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .modal-overlay { background-color: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 50; }
        .photo-preview-item { position: relative; width: 100%; padding-top: 100%; }
        .photo-preview-item img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 0.5rem; border: 1px solid #e2e8f0; }
        .photo-remove-btn { position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; font-size: 12px; font-weight: bold; }
        .preview-table td { padding: 4px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .dark .preview-table td { border-bottom-color: rgba(255,255,255,0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="font-sans antialiased">
    <div id="toast-container" class="fixed top-4 right-4 z-[2000] flex flex-col gap-2"></div>
    <div class="container mx-auto max-w-3xl p-4 sm:p-6 lg:p-8">
        <header class="flex items-center gap-4 mb-8">
            <a href="index.html" class="p-3 bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 text-slate-500 hover:text-red-600 transition-colors flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
                <span class="font-bold hidden sm:inline">Меню</span>
            </a>
            <div class="flex-1 text-center">
                <h1 class="text-3xl font-bold text-red-700 dark:text-red-500">Рекламація</h1>
                <p class="text-red-600 dark:text-red-400 text-sm font-bold mt-1 uppercase tracking-wide">ФУДЛАЙН ПРОДАКШН</p>
            </div>
            <button id="themeToggle" class="p-3 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </header>

        <div class="card p-8 rounded-lg shadow-lg border border-slate-200 dark:border-slate-700 space-y-6 relative">
            <div class="mt-2">
                <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Контролер *</label>
                <select id="employeeSelect" class="w-full bg-transparent border-2 border-slate-300 dark:border-slate-600 rounded-lg py-4 px-4 text-lg" required>
                    <option value="" disabled selected>Оберіть...</option>
                </select>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Постачальник *</label>
                    <input type="text" id="supplier" placeholder="Назва постачальника" class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Назва товару *</label>
                    <input type="text" id="product" placeholder="Назва товару" class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Партія</label>
                        <input type="text" id="batch" placeholder="Номер партії" class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">Дата поставки</label>
                        <input type="date" id="deliveryDate" class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase mb-2">№ Документа поставки</label>
                    <input type="text" id="docNum" placeholder="ТТН або видаткова" class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="block text-sm font-bold text-slate-500 dark:text-slate-400 uppercase">Опис невідповідності *</label>
                        <button type="button" onclick="generateTemplate()" class="text-[10px] bg-slate-100 dark:bg-slate-700 hover:bg-red-50 text-red-600 font-bold py-1 px-2 rounded-md border border-red-200">📄 Сформувати шаблон</button>
                    </div>
                    <textarea id="description" rows="10" placeholder="Детально опишіть проблему..." class="border-2 border-slate-300 dark:border-slate-600 rounded-lg py-3 px-4 text-sm"></textarea>
                </div>
            </div>

            <div class="bg-red-50 dark:bg-red-900/10 p-4 rounded-lg border border-red-200 dark:border-red-900/30">
                <div class="flex items-center justify-between mb-4">
                    <div>
                        <h4 class="font-bold text-sm mb-1 text-slate-700 dark:text-slate-200">Фото докази</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400">Стиснуті для PDF та пошти</p>
                    </div>
                    <label class="cursor-pointer bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span>Додати</span>
                        <input type="file" id="photo-upload" accept="image/*" multiple class="hidden" onchange="handleFiles(this)">
                    </label>
                </div>
                <div id="gallery-container" class="grid grid-cols-3 gap-2 hidden"></div>
            </div>
            <button onclick="initiateSend()" class="w-full mt-8 bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-lg shadow-lg active:scale-95 transition-transform flex justify-center items-center gap-2 text-lg">
                <span>📤 Відправити рекламацію</span>
            </button>
        </div>
    </div>

    <!-- Модальне вікно -->
    <div id="sendModal" class="hidden fixed inset-0 items-center justify-center modal-overlay p-4 z-50">
        <div class="card p-6 rounded-2xl shadow-2xl w-full max-w-md flex flex-col max-h-[95vh] border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-4">
                <div class="w-14 h-14 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center mx-auto mb-2 text-3xl">📄</div>
                <h3 class="text-xl font-bold">Перевірка даних</h3>
                <p class="text-xs text-slate-500 uppercase tracking-widest font-semibold">Акт невідповідності</p>
            </div>
            <div class="overflow-y-auto mb-6 pr-1 custom-scrollbar" id="reportPreview"></div>
            <p id="sendStatus" class="text-center text-lg font-bold mb-4 text-emerald-600 min-h-[1.5em]"></p>
            <div id="sendActions" class="flex flex-col gap-3">
                <button id="doSendBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-[0.98] text-lg">✅ Надіслати Акт</button>
                <button onclick="closeSendModal()" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold py-3 rounded-xl transition-colors">Скасувати</button>
            </div>
            <div id="sendSpinner" class="hidden py-6 flex justify-center"><div class="spinner"></div></div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxZlxn6TPJoFnqkKo9kej2UliB2G_BgKO00lAAWR05_DPDoTrq-tFbNBsCNoLZJHG5vBw/exec";
        const employees = ["Соботович Л.М.", "Огаркова М.В.", "Інший"];
        const empSel = document.getElementById('employeeSelect');
        employees.forEach(e => empSel.add(new Option(e, e)));
        const saved = localStorage.getItem('qc_user');
        if(saved) empSel.value = saved;
        empSel.onchange = () => localStorage.setItem('qc_user', empSel.value);
        document.getElementById('themeToggle').addEventListener('click', () => document.documentElement.classList.toggle('dark'));

        function generateTemplate() {
            const product = document.getElementById('product').value || "[назва товару]";
            const supplier = document.getElementById('supplier').value || "[постачальник]";
            document.getElementById('description').value = `Під час перевірки поставленої продукції "${product}" від постачальника "${supplier}" було виявлені недоліки (дефекти):\n\n1. _______________________________________\n\nЗазначені недоліки є істотним порушенням якості, не відповідають безпечності харчової продукції і унеможливлюють використання партії у виробничому процесі ПП "ФУДЛАЙН ПРОДАКШН".\n\nВимоги:\n1. Протягом 3 (трьох) робочих днів розглянути цей акт, надати письмову відповідь. Контактна особа: Долгополов Костянтин Валентинович, тел. 050 469 25 61.\n\n2. Провести розслідування щодо даного браку для запобігання подібним випадкам у майбутньому.\n\nДодатки: \n1. Фотографії, що ілюструють невідповідність (________________________________)`;
            showToast("Шаблон сформовано");
        }

        let uploadedFiles = [];
        async function handleFiles(input) {
            const files = input.files;
            if (files && files.length > 0) {
                const container = document.getElementById('gallery-container');
                container.classList.remove('hidden');
                for (const file of Array.from(files)) {
                    const base64 = await resizeAndCompress(file);
                    uploadedFiles.push({ name: file.name, type: "image/jpeg", data: base64 });
                    const div = document.createElement('div');
                    div.className = 'photo-preview-item';
                    div.innerHTML = `<img src="${base64}"><div class="photo-remove-btn" onclick="removeFile(this, '${base64}')">✕</div>`;
                    container.appendChild(div);
                }
            }
            input.value = '';
        }

        function resizeAndCompress(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height, max = 1200;
                        if (w > h && w > max) { h *= max/w; w = max; } else if (h > max) { w *= max/h; h = max; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function removeFile(btn, data) {
            btn.parentElement.remove();
            uploadedFiles = uploadedFiles.filter(f => f.data !== data);
            if(!uploadedFiles.length) document.getElementById('gallery-container').classList.add('hidden');
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-lg border-l-4 bg-emerald-50 border-emerald-500 text-emerald-700`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        let pendingData = null;
        function initiateSend() {
            const data = {
                type: "reclamation",
                employee: empSel.value,
                supplier: document.getElementById('supplier').value,
                product: document.getElementById('product').value,
                batch: document.getElementById('batch').value,
                date: document.getElementById('deliveryDate').value,
                doc: document.getElementById('docNum').value,
                desc: document.getElementById('description').value,
                files: uploadedFiles
            };
            if(!data.employee || !data.supplier || !data.product || !data.desc) return;
            pendingData = data;
            document.getElementById('reportPreview').innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-center mb-2"><img src="https://foodline-production.com/wp-content/uploads/2021/10/3752781497_3752781497.webp" class="h-8 opacity-80"></div>
                    <div class="bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">
                        <table class="w-full text-sm preview-table">
                            <tr><td class="font-bold text-slate-400 w-2/5 text-[9px]">📍 ПОСТАЧАЛЬНИК</td><td>${data.supplier}</td></tr>
                            <tr><td class="font-bold text-slate-400 w-2/5 text-[9px]">📦 ТОВАР</td><td>${data.product}</td></tr>
                            <tr><td class="font-bold text-slate-400 w-2/5 text-[9px]">🆔 ПАРТІЯ</td><td>${data.batch || '—'}</td></tr>
                            <tr><td class="font-bold text-slate-400 w-2/5 text-[9px]">📅 ДАТА</td><td>${data.date || '—'}</td></tr>
                        </table>
                    </div>
                    <div class="bg-red-50 dark:bg-red-900/10 p-3 rounded-xl border border-red-100 dark:border-red-900/20 text-[10px]">${data.desc.replace(/\n/g, '<br>')}</div>
                    ${uploadedFiles.length > 0 ? `<div class="flex flex-wrap gap-2">${uploadedFiles.map(f => `<img src="${f.data}" class="w-12 h-12 object-cover rounded">`).join('')}</div>` : ''}
                </div>
            `;
            document.getElementById('sendModal').classList.remove('hidden'); document.getElementById('sendModal').classList.add('flex');
        }

        async function executeSend() {
            const actions = document.getElementById('sendActions'), spinner = document.getElementById('sendSpinner'), status = document.getElementById('sendStatus');
            actions.style.display = 'none'; spinner.classList.remove('hidden'); status.innerText = "Формування...";
            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(pendingData) });
                status.innerText = "✅ Надіслано!";
                setTimeout(() => location.reload(), 2000);
            } catch(e) { status.innerText = "❌ Помилка"; actions.style.display = 'flex'; spinner.classList.add('hidden'); }
        }
        document.getElementById('doSendBtn').onclick = executeSend;
        function closeSendModal() { document.getElementById('sendModal').classList.add('hidden'); document.getElementById('sendModal').classList.remove('flex'); }
    </script>
</body>
</html>
